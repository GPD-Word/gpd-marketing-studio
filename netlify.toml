[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/api/*"
to = "https://gpd-marketing-studio-backend.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/health"
to = "https://gpd-marketing-studio-backend.onrender.com/health"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
